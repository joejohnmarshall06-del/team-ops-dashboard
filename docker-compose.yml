services:
  api:
    build:
      context: ./server
    ports:
      - "4000:4000"
    volumes:
      - ops-data:/app/data
    environment:
      - PORT=4000
      - DATABASE_PATH=/app/data/ops.db

  client:
    build:
      context: ./client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:4000
    depends_on:
      - api

volumes:
  ops-data:

